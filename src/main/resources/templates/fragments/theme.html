<button type="button" id="themeToggle" class="btn btn-outline-secondary btn-sm me-3" th:fragment="theme"
	onclick="toggleTheme()" th:data-label-dark="#{web.theme.dark}" th:data-label-light="#{web.theme.light}"
	data-label-dark="Switch to dark theme" data-label-light="Switch to light theme">
	<i class="fas fa-moon"></i>
</button>
